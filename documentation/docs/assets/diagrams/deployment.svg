<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-size="12" fill="#17181C">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#17181C"/>
    </marker>
  </defs>
  <rect width="1240" height="700" fill="#FFFFFF"/>

  <!-- developer laptop node -->
  <g stroke="#17181C" stroke-width="1.3" fill="#FFFFFF">
    <path d="M40,90 L52,78 L312,78 L312,198 L300,210 L40,210 Z"/>
    <path d="M40,90 L300,90 L300,210 M300,90 L312,78"/>
  </g>
  <text x="52" y="110" font-weight="600">«device» Developer laptop</text>
  <text x="52" y="128" font-size="11" fill="#4F4D48">Windows 11 · Node 24 · Docker Desktop (dev DB)</text>
  <g stroke="#8A8880" stroke-width="1" fill="#F1EFEA">
    <rect x="52" y="140" width="236" height="24" rx="3"/>
    <rect x="52" y="172" width="236" height="24" rx="3"/>
  </g>
  <text x="170" y="156" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, Consolas, monospace">git repository npm-monitor</text>
  <text x="170" y="188" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, Consolas, monospace">scripts/deploy.sh</text>
  <text x="40" y="228" font-size="11" fill="#4F4D48">deploy.sh: git push to the node over SSH,</text>
  <text x="40" y="242" font-size="11" fill="#4F4D48">then ssh: docker compose up -d --build</text>

  <!-- browser node -->
  <rect x="40" y="262" width="260" height="60" rx="4" fill="#F1EFEA" stroke="#8A8880" stroke-width="1.2"/>
  <text x="170" y="285" text-anchor="middle" font-weight="600">Browser</text>
  <text x="170" y="303" text-anchor="middle" font-size="11" fill="#4F4D48">home LAN 192.168.1.0/24 or Tailscale</text>

  <!-- server node -->
  <g stroke="#17181C" stroke-width="1.4" fill="#FFFFFF">
    <path d="M360,52 L374,38 L980,38 L980,646 L966,660 L360,660 Z"/>
    <path d="M360,52 L966,52 L966,660 M966,52 L980,38"/>
  </g>
  <text x="374" y="74" font-size="14" font-weight="600">«device» always-on node — laptop, Ubuntu 26.04 LTS</text>
  <text x="374" y="92" font-size="11" fill="#4F4D48">i5-8250U · 7 GB RAM · 231 GB disk · sleep disabled · unattended-upgrades (reboot 04:00)</text>

  <!-- left column: system services -->
  <g stroke="#17181C" stroke-width="1.2" fill="#FFFFFF">
    <rect x="380" y="112" width="190" height="96" rx="4"/>
    <rect x="380" y="252" width="190" height="70" rx="4"/>
    <rect x="380" y="352" width="190" height="56" rx="4"/>
    <rect x="380" y="438" width="190" height="84" rx="4"/>
  </g>
  <text x="392" y="131" font-weight="600">«service» PostgreSQL 18</text>
  <text x="392" y="149" font-size="11" fill="#4F4D48">127.0.0.1:5432 · db npm_monitor</text>
  <text x="392" y="165" font-size="11" fill="#4F4D48">three roles (passwords in .env)</text>
  <text x="392" y="181" font-size="11" fill="#4F4D48">pg_dumpall daily 03:30 →</text>
  <text x="392" y="197" font-size="11" fill="#4F4D48">~/server/backups, 14 days kept</text>
  <text x="392" y="271" font-weight="600">«service» nginx</text>
  <text x="392" y="289" font-size="11" fill="#4F4D48">:80 · location /npm/</text>
  <text x="392" y="305" font-size="11" fill="#4F4D48">proxy_pass 127.0.0.1:8090</text>
  <text x="392" y="371" font-weight="600">«service» Tailscale</text>
  <text x="392" y="389" font-size="11" fill="#4F4D48">tailscale0 · tailnet address</text>
  <text x="392" y="403" font-size="11" fill="#4F4D48">UFW allows all traffic on it</text>
  <text x="392" y="457" font-weight="600">«artifact» work tree</text>
  <text x="392" y="475" font-size="11" font-family="IBM Plex Mono, Consolas, monospace">~/server/sites/npm-monitor</text>
  <text x="392" y="491" font-size="11" fill="#4F4D48">git, receive.denyCurrentBranch=</text>
  <text x="392" y="505" font-size="11" fill="#4F4D48">updateInstead · .env (mode 600)</text>

  <!-- docker engine node -->
  <g stroke="#17181C" stroke-width="1.3" fill="#FFFFFF">
    <path d="M600,124 L612,112 L958,112 L958,508 L946,520 L600,520 Z"/>
    <path d="M600,124 L946,124 L946,520 M946,124 L958,112"/>
  </g>
  <text x="612" y="144" font-weight="600">«execution environment» Docker Engine 29 · Compose 2.40</text>
  <text x="612" y="160" font-size="11" fill="#4F4D48">image npm-monitor:latest (node:24-alpine)</text>
  <text x="612" y="174" font-size="11" fill="#4F4D48">network_mode: host · restart: unless-stopped</text>

  <!-- containers 3 x 2 -->
  <g stroke="#8A8880" stroke-width="1.2" fill="#F1EFEA">
    <rect x="612" y="192" width="104" height="56" rx="4"/>
    <rect x="728" y="192" width="104" height="56" rx="4" stroke="#2A78D6"/>
    <rect x="844" y="192" width="104" height="56" rx="4" stroke="#EB6834"/>
    <rect x="612" y="262" width="104" height="56" rx="4"/>
    <rect x="728" y="262" width="104" height="56" rx="4"/>
    <rect x="844" y="262" width="104" height="56" rx="4" stroke-dasharray="4 3"/>
  </g>
  <g text-anchor="middle">
    <text x="664" y="210" font-size="11" fill="#4F4D48">«container»</text>
    <text x="664" y="228" font-weight="600">collector</text>
    <text x="664" y="242" font-size="11" fill="#4F4D48">→ change feed</text>
    <text x="780" y="210" font-size="11" fill="#4F4D48">«container»</text>
    <text x="780" y="228" font-weight="600">stage1</text>
    <text x="780" y="242" font-size="11" fill="#2A78D6">no network</text>
    <text x="896" y="210" font-size="11" fill="#4F4D48">«container»</text>
    <text x="896" y="228" font-weight="600">stage2</text>
    <text x="896" y="242" font-size="11" fill="#EB6834">→ 5 sources</text>
    <text x="664" y="280" font-size="11" fill="#4F4D48">«container»</text>
    <text x="664" y="298" font-weight="600">web</text>
    <text x="664" y="312" font-size="11" fill="#4F4D48">127.0.0.1:8090</text>
    <text x="780" y="280" font-size="11" fill="#4F4D48">«container»</text>
    <text x="780" y="298" font-weight="600">popular</text>
    <text x="780" y="312" font-size="11" fill="#4F4D48">→ ecosyste.ms</text>
    <text x="896" y="280" font-size="11" fill="#4F4D48">«container»</text>
    <text x="896" y="298" font-weight="600">migrate</text>
    <text x="896" y="312" font-size="11" fill="#4F4D48">one-shot, exits 0</text>
  </g>
  <text x="612" y="346" font-size="11" fill="#4F4D48">migrate runs first; the other six start</text>
  <text x="612" y="360" font-size="11" fill="#4F4D48">after it exits successfully</text>
  <text x="612" y="382" font-size="11" fill="#4F4D48">stop_grace_period 30 s · json-file logs 10 MB × 5</text>
  <text x="612" y="396" font-size="11" fill="#4F4D48">seventh container, not drawn: maintenance (daily)</text>
  <text x="612" y="420" font-size="11" fill="#4F4D48">Every container reads its DATABASE_URL from .env</text>
  <text x="612" y="434" font-size="11" fill="#4F4D48">and talks to the host's PostgreSQL on 127.0.0.1 —</text>
  <text x="612" y="448" font-size="11" fill="#4F4D48">no Docker network and no DB container.</text>

  <!-- perimeter note -->
  <rect x="380" y="548" width="566" height="92" rx="4" fill="#FFFFFF" stroke="#8A8880" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="392" y="568" font-weight="600" font-size="12">Perimeter</text>
  <text x="392" y="586" font-size="11" fill="#4F4D48">UFW: default deny incoming · limit 22/tcp (ssh) · allow 80, 443 · allow in on tailscale0 · fail2ban on sshd</text>
  <text x="392" y="602" font-size="11" fill="#4F4D48">PostgreSQL and the web service listen on 127.0.0.1 only; the dashboard is reachable solely through nginx.</text>
  <text x="392" y="618" font-size="11" fill="#4F4D48">Secrets (DB password, GITHUB_TOKEN) live only in the server's .env; the repository ships .env.example.</text>

  <!-- arrows laptop -> server -->
  <line x1="312" y1="150" x2="358" y2="150" stroke="#17181C" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="335" y="141" text-anchor="middle" font-size="11">SSH 22</text>

  <!-- browser -> nginx -->
  <line x1="300" y1="287" x2="378" y2="287" stroke="#17181C" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="339" y="278" text-anchor="middle" font-size="11">HTTP :80</text>
  <text x="339" y="303" text-anchor="middle" font-size="11" fill="#4F4D48">/npm/</text>

  <!-- nginx -> web, containers -> postgres -->
  <line x1="570" y1="290" x2="610" y2="290" stroke="#17181C" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="590" y="281" text-anchor="middle" font-size="11">8090</text>
  <line x1="600" y1="170" x2="572" y2="170" stroke="#17181C" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="586" y="188" text-anchor="middle" font-size="11">5432</text>

  <!-- external systems (right) -->
  <g fill="#F1EFEA" stroke="#8A8880" stroke-width="1.2">
    <rect x="1020" y="112" width="200" height="52" rx="4"/>
    <rect x="1020" y="184" width="200" height="52" rx="4"/>
    <rect x="1020" y="256" width="200" height="52" rx="4"/>
    <rect x="1020" y="328" width="200" height="52" rx="4"/>
    <rect x="1020" y="400" width="200" height="52" rx="4"/>
    <rect x="1020" y="472" width="200" height="52" rx="4"/>
  </g>
  <g text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-weight="600">
    <text x="1120" y="132">replicate.npmjs.com</text>
    <text x="1120" y="204">registry.npmjs.org</text>
    <text x="1120" y="276">packages.ecosyste.ms</text>
    <text x="1120" y="348">api.deps.dev</text>
    <text x="1120" y="420">api.github.com</text>
    <text x="1120" y="492">rdap.org</text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#4F4D48">
    <text x="1120" y="150">change feed · collector</text>
    <text x="1120" y="222">packuments · stage2</text>
    <text x="1120" y="294">repo state, top list · stage2, popular</text>
    <text x="1120" y="366">attested source · stage2</text>
    <text x="1120" y="438">commit check · stage2 (token)</text>
    <text x="1120" y="510">e-mail domain · stage2</text>
  </g>
  <g stroke="#17181C" stroke-width="1.3" fill="none">
    <line x1="958" y1="138" x2="1018" y2="138" marker-end="url(#arrow)"/>
    <line x1="958" y1="210" x2="1018" y2="210" marker-end="url(#arrow)"/>
    <line x1="958" y1="282" x2="1018" y2="282" marker-end="url(#arrow)"/>
    <line x1="958" y1="354" x2="1018" y2="354" marker-end="url(#arrow)"/>
    <line x1="958" y1="426" x2="1018" y2="426" marker-end="url(#arrow)"/>
    <line x1="958" y1="498" x2="1018" y2="498" marker-end="url(#arrow)"/>
  </g>
  <text x="1020" y="104" font-size="11">HTTPS 443, outbound only</text>
</svg>
