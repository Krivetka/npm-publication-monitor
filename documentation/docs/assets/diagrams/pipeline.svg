<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 1000" width="1340" height="1000" role="img" aria-labelledby="t d" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <title id="t">Pipeline of the npm Publication Monitor</title>
  <desc id="d">The collector writes the npm change feed to the event journal. Stage 1 scores every event without network requests in four lanes. Only candidates go to stage 2, which enriches them under source quotas. The final risk score goes to the storage, the dashboard and the alerts.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#B9B7B0"/></marker>
    <style>
      .box{fill:#FFFFFF;stroke:#C9C7C0;stroke-width:2}
      .s1{fill:#E4EEF9;stroke:#2A78D6;stroke-width:3}
      .s2{fill:#ECECEA;stroke:#C9C7C0;stroke-width:2}
      .in1{fill:#E4EEF9;stroke:#C9C7C0;stroke-width:2}
      .in2{fill:#ECECEA;stroke:#C9C7C0;stroke-width:2}
      .h{font-size:24px;font-weight:700;fill:#17181C;text-anchor:middle}
      .p{font-size:20px;fill:#4F4D48;text-anchor:middle}
      .g{font-size:25px;font-weight:700;fill:#17181C}
      .n{font-size:20px;fill:#4F4D48}
      .ar{stroke:#B9B7B0;stroke-width:2;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1340" height="1000" fill="#FFFFFF"/>
  <text x="42" y="60" font-size="27" font-weight="700" fill="#17181C">Only selected publications get the costly enrichment</text>

  <rect class="box" x="42" y="142" width="368" height="98" rx="14"/>
  <text class="h" x="226" y="184">npm change feed</text>
  <text class="p" x="226" y="216">polled with a cursor</text>
  <rect class="box" x="488" y="142" width="368" height="98" rx="14"/>
  <text class="h" x="672" y="184">Collector</text>
  <text class="p" x="672" y="216">idempotent write</text>
  <rect class="box" x="934" y="142" width="368" height="98" rx="14"/>
  <text class="h" x="1118" y="184">Event journal</text>
  <text class="p" x="1118" y="216">background for the experiment</text>
  <path class="ar" d="M410 191H486"/>
  <path class="ar" d="M856 191H932"/>
  <path class="ar" d="M1118 240V288"/>

  <rect class="s1" x="42" y="290" width="1260" height="212" rx="14"/>
  <text class="g" x="70" y="336">Stage 1 · no network requests</text>
  <rect class="in1" x="70" y="361" width="280" height="112" rx="12"/>
  <text class="h" x="210" y="404">Temporal</text>
  <text class="p" x="210" y="436">publication bursts</text>
  <rect class="in1" x="378" y="361" width="280" height="112" rx="12"/>
  <text class="h" x="518" y="404">Nominal</text>
  <text class="p" x="518" y="436">look-alike names</text>
  <rect class="in1" x="686" y="361" width="280" height="112" rx="12"/>
  <text class="h" x="826" y="404">Revision</text>
  <text class="p" x="826" y="436">revision anomalies</text>
  <rect class="in1" x="994" y="361" width="280" height="112" rx="12"/>
  <text class="h" x="1134" y="404">Watchlist</text>
  <text class="p" x="1134" y="436">top 1000, no thresholds</text>

  <path class="ar" d="M672 502V564"/>
  <text class="n" x="694" y="541">candidates only</text>

  <rect class="s2" x="42" y="566" width="1260" height="212" rx="14"/>
  <text class="g" x="70" y="612">Stage 2 · enrichment under source quotas</text>
  <rect class="in2" x="70" y="637" width="383" height="112" rx="12"/>
  <text class="h" x="261" y="680">Publisher of the version</text>
  <text class="p" x="261" y="712">compared with the release history</text>
  <rect class="in2" x="481" y="637" width="382" height="112" rx="12"/>
  <text class="h" x="672" y="680">Maintainers</text>
  <text class="p" x="672" y="712">set, age, changes</text>
  <rect class="in2" x="891" y="637" width="383" height="112" rx="12"/>
  <text class="h" x="1082" y="680">Manifest</text>
  <text class="p" x="1082" y="712">scripts, size, repository</text>

  <path class="ar" d="M307 778V840"/>
  <rect class="box" x="42" y="842" width="531" height="84" rx="14"/>
  <text class="h" x="307" y="893">Final risk score</text>
  <path class="ar" d="M573 884H769"/>
  <rect class="box" x="771" y="842" width="531" height="84" rx="14"/>
  <text class="h" x="1036" y="893">Storage, dashboard, alerts</text>
</svg>
