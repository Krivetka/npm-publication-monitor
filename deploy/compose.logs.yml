# Centralised logs: Grafana Alloy tails every container's JSON log and ships it to
# Grafana Cloud Loki (free tier). Optional overlay:
#   docker compose -f docker-compose.yml -f deploy/compose.logs.yml up -d
# Needs in .env: GRAFANA_LOKI_URL, GRAFANA_LOKI_USER, GRAFANA_LOKI_TOKEN
# (Grafana Cloud → Connections → Loki → "Send logs" shows all three).
services:
  logs:
    image: grafana/alloy:latest
    command: ["run", "--server.http.listen-addr=127.0.0.1:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    env_file: .env
    network_mode: host
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  alloy-data:
